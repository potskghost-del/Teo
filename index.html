<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo - Trò Chơi Kết Thúc</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#060913',
                            purple: '#7e22ce',
                            blue: '#2563eb',
                            glow: '#a855f7'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #060913;
            color: #f3f4f6;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.25);
        }
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .animate-pop-in {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-950 via-purple-950/40 to-slate-950 p-4 relative overflow-hidden selection:bg-purple-600 selection:text-white">

    <!-- Lớp Nền Phía Sau (Đốm sáng Cyber Glow) -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute top-1/3 left-1/3 w-64 h-64 bg-blue-600/15 rounded-full blur-[100px] pointer-events-none"></div>

    <!-- OVERLAY FULLSCREEN -->
    <div id="eventOverlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 transition-opacity duration-300">
        
        <!-- MODAL HOÀN KẾT -->
        <div class="glass-card w-full max-w-md rounded-3xl p-6 md:p-8 text-center space-y-6 shadow-2xl shadow-purple-950/50 relative overflow-hidden animate-pop-in">
            
            <!-- Đốm sáng nhỏ bên trong Card -->
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-red-500/20 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-purple-500/20 rounded-full blur-2xl pointer-events-none"></div>

            <!-- Header Icon Cúp / Cờ Đích -->
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-gradient-to-tr from-red-600/30 to-purple-600/30 border border-red-500/40 text-red-400 shadow-lg shadow-red-500/20 mb-2">
                <i class="fa-solid fa-flag-checkered text-4xl animate-bounce"></i>
            </div>

            <!-- Tiêu đề & Nội dung -->
            <div class="space-y-2">
                <span class="inline-block px-3 py-1 text-[11px] font-extrabold uppercase tracking-widest text-red-300 bg-red-950/60 border border-red-500/30 rounded-full">
                    Sự Kiện Đã Khép Lại
                </span>
                <h1 class="text-2xl md:text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-red-400 via-purple-300 to-indigo-300 uppercase tracking-wide">
                    Trò Chơi Đã Kết Thúc
                </h1>
                <p class="text-xs md:text-sm text-slate-300 leading-relaxed pt-1">
                    Cảm ơn bạn đã đồng hành và tham gia trải nghiệm. Rất hân hạnh được gặp lại bạn trong những sự kiện tiếp theo!
                </p>
            </div>

            <!-- Thống kê ngắn gọn / Điểm nhấn -->
            <div class="p-4 rounded-2xl bg-slate-950/60 border border-purple-900/40 flex items-center justify-around gap-2 text-xs">
                <div class="text-center">
                    <span class="block text-slate-400 text-[10px] uppercase font-semibold">Trạng thái</span>
                    <span class="font-bold text-red-400">Đã hoàn thành</span>
                </div>
                <div class="h-8 w-[1px] bg-purple-900/50"></div>
                <div class="text-center">
                    <span class="block text-slate-400 text-[10px] uppercase font-semibold">Hệ thống</span>
                    <span class="font-bold text-purple-300">MF-Point</span>
                </div>
            </div>

            <!-- Nút Xác Nhận / Đóng -->
            <button onclick="closePopup()" class="w-full py-3.5 px-6 bg-gradient-to-r from-red-600 via-purple-600 to-blue-600 hover:from-red-500 hover:via-purple-500 hover:to-blue-500 text-white font-extrabold text-sm rounded-xl shadow-lg shadow-purple-600/30 transition-all active:scale-[0.98] cursor-pointer">
                <i class="fa-solid fa-check-circle mr-2"></i> XÁC NHẬN & ĐÓNG
            </button>
        </div>

    </div>

    <script>
        // Tự động hiển thị Modal ngay khi tải trang
        window.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('eventOverlay');
            overlay.classList.remove('hidden');
        });

        // Hàm ẩn Overlay khi bấm nút
        function closePopup() {
            const overlay = document.getElementById('eventOverlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300);
        }
    </script>
</body>
  </html>
